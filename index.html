<div style="position:relative; background:#ffffff; width:100%; height:560px; overflow:hidden; border-radius:12px;">
<style>
@keyframes shimmer{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
@keyframes breathe{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.04)}}
@keyframes drift1{0%,100%{transform:translate(-10%,-10%)}50%{transform:translate(10%,15%)}}
@keyframes drift2{0%,100%{transform:translate(15%,10%)}50%{transform:translate(-15%,-10%)}}
@keyframes drift3{0%,100%{transform:translate(-15%,5%)}50%{transform:translate(10%,-15%)}}
canvas{position:absolute; top:0; left:0; width:100%; height:100%;}
.blob{position:absolute; border-radius:50%; filter:blur(60px); opacity:0.55; mix-blend-mode:multiply;}
</style>
<div class="blob" style="width:340px;height:340px;background:radial-gradient(circle,#7F77DD,transparent 70%);top:5%;left:0%;animation:drift1 9s ease-in-out infinite;"></div>
<div class="blob" style="width:300px;height:300px;background:radial-gradient(circle,#1D9E75,transparent 70%);top:55%;left:60%;animation:drift2 11s ease-in-out infinite;"></div>
<div class="blob" style="width:280px;height:280px;background:radial-gradient(circle,#D4537E,transparent 70%);top:60%;left:5%;animation:drift3 8s ease-in-out infinite;"></div>
<div class="blob" style="width:260px;height:260px;background:radial-gradient(circle,#EF9F27,transparent 70%);top:0%;left:65%;animation:drift2 10s ease-in-out infinite;"></div>
<canvas id="net"></canvas>
<div style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); z-index:5; text-align:center; animation:breathe 3s ease-in-out infinite;">
<div style="font-family:sans-serif; font-size:48px; font-weight:500; letter-spacing:2px; background:linear-gradient(90deg,#7F77DD,#1D9E75,#D4537E,#EF9F27,#378ADD,#7F77DD); background-size:300% 100%; -webkit-background-clip:text; background-clip:text; color:transparent; animation:shimmer 5s linear infinite;">blank site 26c</div>
</div>
</div>
<script>
(function(){
  const canvas = document.getElementById('net');
  const ctx = canvas.getContext('2d');
  const wrap = canvas.parentElement;
  function resize(){canvas.width = wrap.clientWidth; canvas.height = wrap.clientHeight;}
  resize();
  window.addEventListener('resize', resize);
  const colors = ['#7F77DD','#1D9E75','#D4537E','#EF9F27','#378ADD'];
  const N = 55;
  const pts = [];
  for(let i=0;i<N;i++){
    pts.push({
      x: Math.random()*canvas.width,
      y: Math.random()*canvas.height,
      vx: (Math.random()-0.5)*0.4,
      vy: (Math.random()-0.5)*0.4,
      r: 1.5 + Math.random()*2,
      c: colors[Math.floor(Math.random()*colors.length)]
    });
  }
  function tick(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    for(let i=0;i<N;i++){
      const p = pts[i];
      p.x += p.vx; p.y += p.vy;
      if(p.x<0||p.x>canvas.width) p.vx*=-1;
      if(p.y<0||p.y>canvas.height) p.vy*=-1;
    }
    for(let i=0;i<N;i++){
      for(let j=i+1;j<N;j++){
        const a=pts[i], b=pts[j];
        const dx=a.x-b.x, dy=a.y-b.y;
        const dist = Math.sqrt(dx*dx+dy*dy);
        if(dist < 110){
          ctx.strokeStyle = a.c;
          ctx.globalAlpha = (1 - dist/110) * 0.35;
          ctx.lineWidth = 0.6;
          ctx.beginPath();
          ctx.moveTo(a.x,a.y);
          ctx.lineTo(b.x,b.y);
          ctx.stroke();
        }
      }
    }
    ctx.globalAlpha = 1;
    for(let i=0;i<N;i++){
      const p = pts[i];
      ctx.beginPath();
      ctx.fillStyle = p.c;
      ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fill();
    }
    requestAnimationFrame(tick);
  }
  tick();
})();
</script>
